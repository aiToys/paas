# paas-shop frontend nginx：serve SPA + 反代 /api 到 bff（同源，无 CORS）。
# SSE 透传：proxy_buffering off + X-Accel-Buffering: no（bff 已设），确保 chunk 实时到达。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://paas-shop-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;           # SSE 关键：禁缓冲
        proxy_cache off;
        proxy_read_timeout 300s;       # 长连接（SSE）
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
