name: Bug 报告
description: 报告一个缺陷
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 现象与复现步骤
      description: 你做了什么？期望结果与实际结果分别是什么？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "如 v0.1.0 或 commit hash"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统 / Kubernetes 版本 / Go 版本等
    validations:
      required: true
