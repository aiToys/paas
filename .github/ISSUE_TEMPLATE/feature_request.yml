name: 功能建议
description: 提出一个新功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 当前遇到了什么痛点或限制？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 你期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
