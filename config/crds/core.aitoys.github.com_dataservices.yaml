---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: dataservices.core.aitoys.github.com
spec:
  group: core.aitoys.github.com
  names:
    kind: DataService
    listKind: DataServiceList
    plural: dataservices
    singular: dataservice
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DataService 是平台数据服务资源的 K8s 期望状态声明。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DataServiceSpec 是数据服务期望状态（控制面下发，reconciler 据此落 K8s StatefulSet）。
              Kind 取 dataservice 领域常量（db|cache|mq|storage|vector|search）；
              Engine 取 spec.engine（postgres|redis|kafka|...），reconciler 据 Kind+Engine 选容器镜像。
            properties:
              appId:
                type: string
              connection:
                additionalProperties:
                  type: string
                description: |-
                  Connection 平台生成的连接信息（host/port/credentials/uri），控制面下发，reconciler 读：
                    - 敏感 key（password/token/secretKey/database/accessKey）→ 建 Secret，Pod env 引用；
                    - host/port/uri → 可观测/调试（不进 Secret）。
                type: object
              engine:
                type: string
              envId:
                type: string
              kind:
                type: string
              name:
                type: string
              spec:
                additionalProperties:
                  type: string
                type: object
              tenantId:
                type: string
            required:
            - engine
            - envId
            - kind
            - name
            - tenantId
            type: object
          status:
            description: DataServiceStatus 是 reconcile 后的实际状态（reconciler 回写）。
            properties:
              image:
                type: string
              phase:
                type: string
              ready:
                format: int32
                type: integer
            required:
            - image
            - phase
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
