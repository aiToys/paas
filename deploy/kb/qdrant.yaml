# 知识库（RAG）向量存储后端：共享 qdrant 实例。
# KB 多租户靠 collection 名隔离（kb_{kbID}），共享同一 qdrant 实例（与 core env PAAS_KB_QDRANT_URL 对齐）。
# 镜像来源：内网 registry（library/qdrant，经 daocloud 中转预推），${NODE_IP}:30050 由 deploy-k8s.sh envsubst 注入。
# 凭证固定（dev 集群）；生产应改 Secret 注入。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paas-kb-qdrant
  namespace: paas
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-kb-qdrant
  namespace: paas
  labels:
    app.kubernetes.io/name: paas-kb-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paas-kb-qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paas-kb-qdrant
    spec:
      containers:
        - name: qdrant
          image: ${NODE_IP}:30050/library/qdrant
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
          env:
            # qdrant API 鉴权（core PAAS_KB_QDRANT_API_KEY 与之一致）
            - name: QDRANT__SERVICE__API_KEY
              value: paas-kb-qdrant-dev
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paas-kb-qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: paas-kb-qdrant
  namespace: paas
spec:
  selector:
    app.kubernetes.io/name: paas-kb-qdrant
  ports:
    - port: 6333
      targetPort: 6333
      name: http
