# 知识库（RAG）对象存储后端：共享 minio 实例（存文档原文，异步解析读取）。
# KB 多租户靠 bucket 名隔离（kb-{tenant}），共享同一 minio 实例（与 core env PAAS_KB_MINIO_ENDPOINT 对齐）。
# 镜像来源：内网 registry（library/minio，经 daocloud 中转预推），${NODE_IP}:30050 由 deploy-k8s.sh envsubst 注入。
# 凭证固定（dev 集群）；生产应改 Secret 注入。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paas-kb-minio
  namespace: paas
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-kb-minio
  namespace: paas
  labels:
    app.kubernetes.io/name: paas-kb-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paas-kb-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paas-kb-minio
    spec:
      containers:
        - name: minio
          image: ${NODE_IP}:30050/library/minio
          imagePullPolicy: IfNotPresent
          # minio 镜像 ENTRYPOINT=minio，故用 Args 传子命令（dataservice reconciler 验证过的姿势）
          args: [server, /data, --console-address, ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: paas-kb
            - name: MINIO_ROOT_PASSWORD
              value: paas-kb-minio-dev
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paas-kb-minio
---
apiVersion: v1
kind: Service
metadata:
  name: paas-kb-minio
  namespace: paas
spec:
  selector:
    app.kubernetes.io/name: paas-kb-minio
  ports:
    - port: 9000
      targetPort: 9000
      name: api
