# Loki + Promtail 精简 values（dev 轻量但真实）。
# Promtail 以 DaemonSet 采集全集群 Pod 日志（/var/log/pods/*），自动带 pod label（app 等）。
# 平台 logs 查询（real/logs.go）用 LogQL `{app="...",level="..."} |= "..."`。
---
loki:
  enabled: true
  # 镜像走本地 registry（节点拉不到 docker.io，曾致 ImagePullBackOff）。
  # loki subchart 渲染 image 为 {repository}:{tag}（不加 registry 前缀），故 repository 含完整路径。
  # 注意：promtail subchart 反而会拼 docker.io 前缀，故 promtail 用 registry/repository 分写。
  image:
    repository: hub.wang.dd:5000/observability/loki
    tag: "2.6.1"
  # single binary，dev 不做高可用
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # 7 天保留
  config:
    limits_config:
      retention_period: 168h

promtail:
  enabled: true
  # 镜像走本地 registry（同 loki，registry/repository 分写）。
  image:
    registry: hub.wang.dd:5000
    repository: observability/promtail
    tag: "3.5.1"
  # 抓所有 namespace Pod 日志（含 paas namespace）。
  # 应用级日志查询（real/logs.go）按 namespace + 工作负载 pod 名正则匹配（paas-<tenant>/wl-<id>-.*），
  # 不依赖 promtail 提取自定义 pod label（默认只提取 app/namespace 等通用 label）。
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    # 泳道排障：从 Pod label 提取 paas.aitoys/lane（reconciler 已打）为 Loki label
    # `lane`——日志可按 {lane="feature-x"} 过滤（同服务多泳道并行时区分流量归属）。
    # pod label 键含 / 和 .，需整体转义（promtail label 名只许 [a-zA-Z0-9_]）。
    # 同时提取租户/应用 label，日志侧具备与 trace 一致的排障维度。
    snippets:
      extraScrapeConfigs: |
        - job_name: kubernetes-pods-lane
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_lane]
              target_label: lane
            - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_tenant]
              target_label: paas_tenant
            - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_app]
              target_label: paas_app
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
          pipeline_stages:
            - cri: {}
  # 内存 64Mi → 256Mi：节点 pod 多时 promtail tail 大量文件，64Mi 易 OOMKilled
  # （exit 137 CrashLoopBackOff，实测 kb3 OOM 重启 270 次）。256Mi 稳定。
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # 集群 docker data-root=/data/docker（非默认 /var/lib/docker），kubelet 的
  # /var/log/pods/<pod>/<c>/0.log 是软链 → /data/docker/containers/<id>/<id>-json.log。
  # 默认只挂 /var/log + /var/lib/docker/containers，follow 软链 stat 目标失败。
  # 必须额外挂 /data/docker（readOnly），软链目标可解析。
  extraVolumes:
    - name: data-docker
      hostPath:
        path: /data/docker
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: data-docker
      mountPath: /data/docker
      readOnly: true
  # 只调度到 worker 节点：kb1 是 master，未配 hub.wang.dd:5000 insecure registry，
  # 拉镜像 ImagePullBackOff；master 无业务 pod，放弃采集以保持 DaemonSet 干净。
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists


# 关 pushgateway 等（不需要）
fluent-bit:
  enabled: false
