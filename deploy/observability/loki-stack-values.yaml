# Loki + Promtail 精简 values（dev 轻量但真实）。
# Promtail 以 DaemonSet 采集全集群 Pod 日志（/var/log/pods/*），自动带 pod label（app 等）。
# 平台 logs 查询（real/logs.go）用 LogQL `{app="...",level="..."} |= "..."`。
#
# ⚠ 本文件含 ${...} 占位符，必须经 scripts/deploy-observability.sh 应用（它 envsubst 注入集群相关值）：
#     ${STORAGE_CLASS}          PVC StorageClass
#     ${LOKI_IMAGE_REPO}        loki 镜像完整仓库路径（含 registry 主机）
#     ${PROMTAIL_IMAGE_REGISTRY} / ${PROMTAIL_IMAGE_REPO}  promtail 镜像（registry/repository 分写）
---
loki:
  enabled: true
  # 镜像走内网中转 registry（换集群用 LOKI_IMAGE_REPO 覆盖为可达仓库）。
  # loki subchart 渲染 image 为 {repository}:{tag}（不加 registry 前缀），故 repository 含完整路径。
  # 注意：promtail subchart 反而会拼 docker.io 前缀，故 promtail 用 registry/repository 分写。
  image:
    repository: ${LOKI_IMAGE_REPO}
    tag: "2.6.1"
  # 注解修正：grafana/loki chart 默认注入 prometheus.io/port="http-metrics"（端口**名**而非数字），
  # 而 kube-prometheus-stack 的 kubernetes-pods job 的 relabel 正则 ([^:]+)(?::\d+)?;(\d+) 要求数字，
  # 不匹配即静默失效 → 退回 Pod SD 默认行为（**每个 containerPort 各生成一个 target**），
  # 于是 3100/9095/7946 三个端口全被抓：9095 是 gRPC（HTTP/2，报 malformed HTTP response
  # "\x00\x00\f\x04..."）、7946 是 memberlist（connection reset）。改成数字 3100 后只抓 HTTP 端口。
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
  # single binary，dev 不做高可用
  persistence:
    enabled: true
    storageClassName: ${STORAGE_CLASS}
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # 7 天保留。注意 Loki 2.x retention 必须同时开 compactor.retention_enabled，
  # 只设 retention_period 无效（日志实际永久保留，PVC 写满致 Loki 不可写）。
  config:
    limits_config:
      retention_period: 168h
    compactor:
      shared_store: filesystem
      retention_enabled: true
      retention_delete_delay: 2h

promtail:
  enabled: true
  # 镜像走内网中转 registry（同 loki，registry/repository 分写）。
  image:
    registry: ${PROMTAIL_IMAGE_REGISTRY}
    repository: ${PROMTAIL_IMAGE_REPO}
    tag: "3.5.1"
  # 抓所有 namespace Pod 日志（含 paas namespace）。
  # 应用级日志查询（real/logs.go）按 namespace + 工作负载 pod 名正则匹配（paas-<tenant>/wl-<id>-.*），
  # 不依赖 promtail 提取自定义 pod label（默认只提取 app/namespace 等通用 label）。
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    # 泳道排障：从 Pod label 提取 paas.aitoys/lane（reconciler 已打）为 Loki label
    # `lane`——日志可按 {lane="feature-x"} 过滤（同服务多泳道并行时区分流量归属）。
    # pod label 键含 / 和 .，需整体转义（promtail label 名只许 [a-zA-Z0-9_]）。
    # 同时提取租户/应用 label，日志侧具备与 trace 一致的排障维度。
    snippets:
      # pipeline_stages：cri + docker 双解析。docker shim 集群（/var/log/pods 软链到
      # /data/docker/containers/<id>/<id>-json.log）日志行是 docker JSON 包装
      # （{"log":...,"stream":...,"time":...}），只配 cri 时原样透传入库 → paas/Grafana
      # 日志查询全显示原始 JSON。两 stage 各解析各自格式、非本格式行原样透传，可共存
      # （containerd 集群 cri 生效、docker 集群 docker 生效）。
      pipelineStages:
        - cri: {}
        - docker: {}
      extraScrapeConfigs: |
        - job_name: kubernetes-pods-lane
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_lane]
              target_label: lane
            - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_tenant]
              target_label: paas_tenant
            - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_app]
              target_label: paas_app
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
          pipeline_stages:
            - cri: {}
            - docker: {}
  # 内存 64Mi → 256Mi：节点 pod 多时 promtail tail 大量文件，64Mi 易 OOMKilled
  # （exit 137 CrashLoopBackOff，实测 kb3 OOM 重启 270 次）。256Mi 稳定。
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # 集群 docker data-root=/data/docker（非默认 /var/lib/docker），kubelet 的
  # /var/log/pods/<pod>/<c>/0.log 是软链 → /data/docker/containers/<id>/<id>-json.log。
  # 默认只挂 /var/log + /var/lib/docker/containers，follow 软链 stat 目标失败。
  # 必须额外挂 /data/docker（readOnly），软链目标可解析。
  extraVolumes:
    - name: data-docker
      hostPath:
        path: /data/docker
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: data-docker
      mountPath: /data/docker
      readOnly: true
  # 只调度到 worker 节点：kb1 是 master，未配 hub.wang.dd:5000 insecure registry，
  # 拉镜像 ImagePullBackOff；master 无业务 pod，放弃采集以保持 DaemonSet 干净。
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists


# 关 pushgateway 等（不需要）
fluent-bit:
  enabled: false
