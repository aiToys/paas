# Prometheus 精简 values（dev 轻量但真实）。
# 含：Prometheus server（持久化）+ node-exporter（节点指标）+ 抓 kubelet/cAdvisor（数据服务 Pod 指标）
# 关：alertmanager、kube-state-metrics（YAGNI——应用级指标改按 workload pod 名正则查，无需 KSM label join）。
---
alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: false

prometheus-node-exporter:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

# 额外抓取配置：kubelet cAdvisor（数据服务 Pod 真实指标来源）+ paas-core /metrics
extraScrapeConfigs: |
  # kubelet cAdvisor —— container_cpu_usage_seconds_total / container_memory_working_set_bytes 等
  # 平台数据服务监控（real/metrics.go TargetDataservice）+ 应用级指标（listAppMetrics 按工作负载 pod 名正则）依赖这些。
  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
        source_labels: [__address__]
        regex: (.+)
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  # paas-core 业务指标（internal/metrics Registry：http_requests_total /
  # http_request_duration_seconds / paas_inference_*）。/metrics 在主端口 :8080 暴露。
  # （controller-runtime 进程级指标经 PAAS_METRICS_ADDR=0 关闭，不再抓 :8081。）
  - job_name: 'paas-core'
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['paas']
    relabel_configs:
      # paas-core pod label 是 app.kubernetes.io/name（relabel 下划线替换点号）
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: paas-core
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        target_label: __address__
        replacement: $1:8080

  # 数据服务引擎 exporter sidecar（db.postgres/mysql、cache.redis/valkey、mq.nats）。
  # reconciler 给 STS 注入 exporter sidecar（端口名 exporter@9100，复用主容器 Secret 凭证），
  # 产 pg_stat_activity_count / redis_connected_clients / nats_connz_connections 等业务指标。
  # 仅抓 PaaS 托管 Pod 的 exporter 端口（managed-by=paas + 端口名 exporter）；minio/qdrant/meili
  # 内置 /metrics 走主容器 svc 端口，不经此 job（其指标名不同，real/metrics 查不到自然降级空）。
  # 多租户隔离：namespace + paas_aitoys_tenant label 透传，real/metrics 按租户 ns 限定查询。
  - job_name: 'kubernetes-pods-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_managed_by]
        regex: paas
      - action: keep
        source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: exporter
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_tenant]
        target_label: paas_aitoys_tenant
      - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_dataservice]
        target_label: paas_aitoys_dataservice

  # 应用 Pod 自暴露指标（prometheus.io/scrape 注解发现——controller 给 service Pod 已注）。
  # 应用 RED 指标（http_requests_total 等，real/metrics listAppMetrics 的 rps/latency/errorRate）
  # 依赖此 job；透传 lane/tenant/app label 供泳道与租户维度过滤。未注解的 Pod 不抓（keep 过滤）。
  - job_name: 'paas-app-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_lane]
        target_label: lane
      - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_tenant]
        target_label: paas_aitoys_tenant
      - source_labels: [__meta_kubernetes_pod_label_paas_aitoys_app]
        target_label: paas_aitoys_app

server:
  retention: "7d"
  # TSDB 磁盘上限兜底（略小于 PVC 10Gi，预留 WAL/head 空间；时间 retention 先被触达即删旧）
  retentionSize: "9GB"
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# RBAC：需 nodes/proxy 权限才能抓 kubelet cAdvisor（chart 默认 ClusterRole 含）
rbac:
  create: true
