            "refresh": 1,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "服务在线",
          "datasource": null,
          "description": "各数据服务 exporter 抓取状态",
