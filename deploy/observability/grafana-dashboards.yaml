# Grafana 应用可观测 dashboard（加载路径：grafana file provider 扫 /tmp/dashboards，
# 本 ConfigMap 由 scripts/deploy-observability.sh kubectl apply，挂到 /tmp/dashboards/{app,cp}）。
# label grafana_dashboard=1 是早期 sidecar 方案的遗留，当前无消费方（sidecar 已关，见 grafana-values.yaml），
# 保留仅为将来若启用 sidecar 时零改动可用。
#
# paas-shop 应用总览：RED（RPS/P95/错误率）+ 资源（CPU/内存）+ 状态码分布 + 趋势。
# 数据源：Prometheus（paas-shop /metrics 的 http_requests_total + http_request_duration_seconds）
# + cAdvisor（container_*）。namespace 变量适配多租户（paas-t-acme/paas-t-globex 等）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-paas-app
  namespace: ${NS_OBS}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability-stack
data:
  paas-app-overview.json: |
    {
      "title": "PaaS 应用可观测总览",
      "uid": "paas-app-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "tags": ["paas", "application"],
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "命名空间",
            "type": "query",
            "query": "label_values(http_requests_total, namespace)",
            "refresh": 1,
            "sort": 1,
            "current": {"text": "paas-t-acme", "value": "paas-t-acme"},
            "includeAll": false
          },
          {
            "name": "pod",
            "label": "工作负载",
            "type": "query",
            "query": "label_values(http_requests_total{namespace=\"$namespace\"}, pod)",
            "refresh": 1,
            "current": {"text": "All", "value": "$__all"},
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "请求秒 (RPS)",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"$pod\"}[5m]))", "legendFormat": "rps"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue"}]}}}
        },
        {
          "id": 2, "type": "stat", "title": "P95 延迟",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",pod=~\"$pod\"}[5m]))) * 1000", "legendFormat": "p95"}],
          "fieldConfig": {"defaults": {"unit": "ms", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"value": 100, "color": "yellow"}, {"value": 500, "color": "red"}]}}}
        },
        {
          "id": 3, "type": "stat", "title": "错误率 (5xx)",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "(sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"$pod\",code=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"$pod\"}[5m])), 1) * 100", "legendFormat": "err"}],
          "fieldConfig": {"defaults": {"unit": "percent", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"value": 1, "color": "yellow"}, {"value": 5, "color": "red"}]}}}
        },
        {
          "id": 4, "type": "stat", "title": "CPU 核数",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",pod=~\"$pod\",container!=\"POD\"}[5m]))", "legendFormat": "cpu"}],
          "fieldConfig": {"defaults": {"unit": "cores", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "purple"}]}}}
        },
        {
          "id": 5, "type": "timeseries", "title": "RPS 趋势（按 pod）",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"$pod\"}[5m])) by (pod)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 6, "type": "timeseries", "title": "状态码分布",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"$pod\"}[5m])) by (code)", "legendFormat": "{{code}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 7, "type": "timeseries", "title": "CPU 核数（按 pod）",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",pod=~\"$pod\",container!=\"POD\"}[5m])) by (pod)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}}
        },
        {
          "id": 8, "type": "timeseries", "title": "内存 MiB（按 pod）",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",pod=~\"$pod\",container!=\"POD\"}) by (pod) / 1024 / 1024", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "MiB"}}
        }
      ]
    }
---
# PaaS 控制面可观测（core 自身 + Agent/LLM 链路）。
# core otelhttp + gen_ai span：HTTP 请求速率/延迟 + agent.run/chat/tool span 耗时 + LLM token 用量。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-paas-control-plane
  namespace: ${NS_OBS}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability-stack
data:
  paas-control-plane.json: |
    {
      "title": "PaaS 控制面可观测",
      "uid": "paas-control-plane",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "tags": ["paas", "control-plane"],
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "控制面 RPS",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"paas\"}[5m]))", "legendFormat": "rps"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 2, "type": "stat", "title": "P95 延迟",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"paas\"}[5m]))) * 1000", "legendFormat": "p95"}],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "id": 3, "type": "stat", "title": "CPU 核数",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"paas\",pod=~\"paas-core-.*\",container!=\"POD\"}[5m]))", "legendFormat": "cpu"}],
          "fieldConfig": {"defaults": {"unit": "cores"}}
        },
        {
          "id": 4, "type": "stat", "title": "内存 MiB",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"paas\",pod=~\"paas-core-.*\",container!=\"POD\"}) / 1024 / 1024", "legendFormat": "mem"}],
          "fieldConfig": {"defaults": {"unit": "MiB"}}
        },
        {
          "id": 5, "type": "timeseries", "title": "控制面请求速率（按路由）",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"paas\"}[5m])) by (handler)", "legendFormat": "{{handler}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 6, "type": "timeseries", "title": "延迟分布 P50/P95/P99",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"paas\"}[5m]))) * 1000", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"paas\"}[5m]))) * 1000", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"paas\"}[5m]))) * 1000", "legendFormat": "p99"}
          ],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "id": 7, "type": "timeseries", "title": "CPU/内存趋势",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 8},
          "targets": [
            {"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"paas\",pod=~\"paas-core-.*\",container!=\"POD\"}[5m]))", "legendFormat": "CPU cores"},
            {"expr": "sum(container_memory_working_set_bytes{namespace=\"paas\",pod=~\"paas-core-.*\",container!=\"POD\"}) / 1024 / 1024", "legendFormat": "Memory MiB"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        }
      ]
    }

---
# 基础设施面板（节点/数据服务/集群，2026-09-25 补齐「Grafana 面板 × Prometheus 指标」对账缺口：
# 此前面板仅消费 4 个指标族，node-exporter 155 族 / 数据服务 exporter / KSM 均零面板）。
# 设计对标 Grafana 官方 node-exporter-full(1860) 与 Kubernetes Views(15757/15760)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-paas-infra
  namespace: ${NS_OBS}
  labels:
    app.kubernetes.io/part-of: observability-stack
data:
  paas-node-overview.json: |
    {
      "title": "PaaS 节点总览",
      "uid": "paas-node-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": [
        "paas"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "节点",
            "type": "query",
            "query": "label_values(node_uname_info, node)",
            "refresh": 1,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "在线节点数",
          "datasource": null,
          "description": "node-exporter 抓取存活的节点数",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "count(node_uname_info{node=~\"$node\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU 逻辑核数",
          "datasource": null,
          "description": "所选节点 CPU 核数合计",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "count(node_cpu_seconds_total{mode=\"idle\",node=~\"$node\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "内存总量",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(node_memory_MemTotal_bytes{node=~\"$node\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "根分区使用率",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "100 - node_filesystem_avail_bytes{node=~\"$node\",mountpoint=\"/\"} / node_filesystem_size_bytes{node=~\"$node\",mountpoint=\"/\"} * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU 使用率（按节点）",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "100 - avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\",node=~\"$node\"}[5m])) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "内存使用率（按节点）",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "(1 - node_memory_MemAvailable_bytes{node=~\"$node\"} / node_memory_MemTotal_bytes{node=~\"$node\"}) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU 构成（按 mode 堆叠）",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{mode!~\"idle\",node=~\"$node\"}[5m])) * 100",
              "legendFormat": "{{mode}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "内存构成（堆叠）",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{node=~\"$node\"} - node_memory_MemAvailable_bytes{node=~\"$node\"}",
              "legendFormat": "已用",
              "refId": "A"
            },
            {
              "expr": "node_memory_Cached_bytes{node=~\"$node\"}",
              "legendFormat": "缓存",
              "refId": "B"
            },
            {
              "expr": "node_memory_Buffers_bytes{node=~\"$node\"}",
              "legendFormat": "缓冲",
              "refId": "C"
            },
            {
              "expr": "node_memory_MemAvailable_bytes{node=~\"$node\"}",
              "legendFormat": "可用",
              "refId": "D"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "磁盘使用率（按挂载点）",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "100 - node_filesystem_avail_bytes{node=~\"$node\",fstype!~\"overlay|tmpfs|squashfs|iso9660\"} / node_filesystem_size_bytes{node=~\"$node\",fstype!~\"overlay|tmpfs|squashfs|iso9660\"} * 100",
              "legendFormat": "{{node}} {{mountpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "磁盘读写带宽",
          "datasource": null,
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 20,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
