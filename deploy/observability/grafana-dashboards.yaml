---
# 数据服务「每引擎官方面板」（2026-09-25）：聚合面板之外，各引擎指标维度差异大，
# 对标官方 dashboard（PostgreSQL Database 9628 / Redis Dashboard 11835 / NATS / MinIO / Qdrant 原生指标）。
# 采集口径：pg/redis/nats 走 exporter sidecar（kubernetes-pods-exporter job），
# qdrant/minio 走引擎内置 /metrics + Pod 抓取注解（kubernetes-pods job，reconciler 注入）。
# meilisearch 暂无面板：/metrics 需 --experimental-metrics + master key 鉴权，注解方式带不了 header（留后续）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-paas-ds-engines
  namespace: ${NS_OBS}
  labels:
    grafana_dashboard: "1"
data:
  paas-ds-postgres.json: |
    {
      "title": "PaaS PostgreSQL",
      "uid": "paas-ds-postgres",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": [
        "paas",
        "dataservice"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "命名空间",
            "type": "query",
            "query": "label_values(pg_up, namespace)",
            "refresh": 1,
            "sort": 1,
            "current": {
              "text": "paas-t-acme",
              "value": "paas-t-acme"
            },
            "includeAll": false
          },
          {
            "name": "dataservice",
            "label": "数据服务",
            "type": "query",
            "query": "label_values(pg_up{namespace=~\"$namespace\"}, paas_aitoys_dataservice)",
            "refresh": 1,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "实例存活",
          "datasource": null,
          "description": "postgres-exporter 抓取与连接状态",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(pg_up{namespace=~\"$namespace\",paas_aitoys_dataservice=~\"$dataservice\"})",
