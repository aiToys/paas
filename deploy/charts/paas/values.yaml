# PaaS 控制面 Helm chart 配置。
# 公网路径：image.registry=ghcr.io/aitoys；离线路径：airsync install 改 image.registry 指向私有 registry。

image:
  registry: ghcr.io/aitoys        # 源镜像 registry（离线改私有 registry）
  repository: paas-core
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# 数据库：enabled=true 内置 postgres StatefulSet；false 用外置 db.url
db:
  enabled: true
  url: ""                         # 外置 PG（db.enabled=false 时必填），如 postgres://user:pwd@host:5432/db?sslmode=disable

# 内置 postgres 细节（db.enabled=true 时生效）。
postgres:
  image: postgres:16-alpine       # 内网集群改 registry 全名（如 hub.wang.dd:5000/library/postgres:16-alpine）
  storageClassName: ""            # 指定 StorageClass（如 local-path）；空用集群默认 SC
  storageSize: "10Gi"             # 数据卷大小
  password: "paas-dev"            # 连接密码（生产必改；经 Secret 注入，不进 Deployment 明文 env）
  resources:                      # 资源配额（防 OOM 影响节点 + 防 noisy neighbor）
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# CRD：install=true 时 chart 一并 apply Workload/Dataservice CRD（K8s 数据面纳管所需）。
# 重复 upgrade 幂等；uninstall 会删 CRD（连带 CR 实例，生产慎用 helm uninstall）。
crds:
  install: true

# Ingress：enabled=true 暴露 HTTP（需集群 Ingress Controller）
ingress:
  enabled: false
  className: nginx
  host: paas.example.com

# 环境变量（core 启动配置）
env:
  PAAS_API_KEY: ""                # 自定义 API Key（空则用默认演示 Key）

# DevOps 构建流水线（代码→镜像）。
# builder: k8s=创建 Job Pod 真实构建（DooD，需 K8s + 节点 docker.sock）；process=in-process
#   docker（本地 dev，K8s/distroless 部署不可用）；空=Mock（零依赖派生 digest）。
devops:
  builder: ""
  builderImage: "docker:git"      # k8s 模式 Job 容器镜像（内网改 hub.wang.dd:5000/library/docker:git）
  registry: ""                    # 镜像推送目标 registry（如 hub.wang.dd:5000）
  gitToken: ""                    # 私有 git 仓库 HTTPS token（公开仓库留空）
  registryUser: ""                # registry docker login 用户名（无认证留空）
  registryPass: ""                # registry docker login 密码
  # 内置 Git 后端（Gitea 无头，一站式代码托管）。空则内置仓库创建/浏览降级（外部仓库构建不受影响）。
  # 部署 Gitea：kubectl apply -f deploy/devops/gitea.yaml（paas namespace，ClusterIP）。
  gitea:
    url: ""                       # Gitea API 根地址（如 http://gitea.paas.svc.cluster.local:3000）
    username: ""                  # 平台账号（paas-bot，initContainer 创建）
    password: ""                  # 平台账号密码（与 deploy/devops/gitea.yaml Secret 一致）
    externalURL: ""               # 外部可达地址（开发者本机 clone 用；空则 UI 不展示克隆命令）

# MaaS 推理（airouter 示例 OpenAI 兼容网关；可替换为任意 OpenAI 兼容供应商）
maas:
  airouterApiKey: ""              # airouter 网关 API Key；留空则推理通道返凭证缺失
  airouterBaseUrl: ""             # airouter 网关 BaseURL（如 https://api.openai.com/v1）；留空则需在 admin 后台配置

# 可观测三支柱 + 控制面自身 OTel（指向 observability namespace 真实后端）。
# 任一为空则该支柱降级为 memory 惰性 mock（三支柱独立可混用）。
# 部署后端：见 deploy/observability/*.yaml（Prometheus + Loki + Jaeger + Grafana）。
observability:
  prometheusURL: ""               # Prometheus 根地址（http://prom:9090），查 /api/v1/query_range
  lokiURL: ""                     # Loki 根地址（http://loki:3100），查 /loki/api/v1/query_range
  jaegerURL: ""                   # Jaeger Query 根地址（http://jaeger:16686），查 /api/traces
  otelEndpoint: ""                # OTLP/HTTP 推送地址（host:port，不含 scheme；jaeger:4318）

# 数据面 SDK 接入：把 K8s Endpoints 经 /dp/ API 暴露给数据面 SDK（如 zeus 经 paas-registry 插件）。
# token 注入 service 类型 Pod env（PAAS_DP_TOKEN）；空则不注入。
dataplane:
  token: ""                       # API Key（绑 tenant）；演示可填 sk-acme-admin
  endpoint: ""                    # /dp/ 地址，空用默认 http://paas-core.paas.svc.cluster.local/dp

# 知识库（RAG）后端：共享 qdrant（向量）+ minio（对象存储）实例。
# 任一为空则文档上传/检索 503 降级（KB CRUD 仍可用）。embedding 复用 MaaS airouter（text-embedding-v4）。
# 私有化/集群部署：先 apply deploy/kb/{qdrant,minio}.yaml 起共享实例，再填本段指向它们。
kb:
  qdrantURL: ""                   # qdrant REST 根地址（http://host:6333）
  qdrantAPIKey: ""                # qdrant API key（QDRANT__SERVICE__API_KEY）
  minioEndpoint: ""               # minio API endpoint（host:9000，不含 scheme）
  minioAccessKey: ""              # minio access key（MINIO_ROOT_USER）
  minioSecretKey: ""              # minio secret key（MINIO_ROOT_PASSWORD）

# 演示凭证 seed：true（默认，dev/demo 友好）灌入 admin/123456 + sk-acme-admin/sk-globex-admin/sk-acme-dev；
# 生产部署必须设 false，关闭演示凭证防止开源仓公开值成为后门（PAAS_DISABLE_DEMO_SEED=true）。
seed:
  demo: true

# 身份会话：JWT 签名 secret + cookie Secure + 生产标识。
#   - jwtSecret：生产必填（≥32 字节随机串，openssl rand -hex 32）；空 + prod=true 拒启；dev 空则随机生成。
#   - cookieSecure：HTTP 部署 false（否则浏览器拒收 cookie），配 ingress TLS 后 true。
#   - prod：true 表生产（强制 jwtSecret 非空，且应配合 seed.demo=false 关演示凭证）。
auth:
  jwtSecret: ""
  cookieSecure: false
  prod: false

# core Deployment 配置。
# hostNetwork：true 时 core Pod 用节点网络（dev 集群访问外部 registry 用），生产保持 false。
core:
  hostNetwork: false

# core 容器资源
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
