{{/*
K8s 数据面：core 以 ServiceAccount 身份在集群内纳管 Workload/DataService CRD，
并落地为 Deployment/StatefulSet/Job/CronJob + Service。Cluster 范围 RBAC（数据面 ns
按租户派生 paas-<tenant>，reconcile 集群级 watch + EnsureNamespace 创建租户 ns）。
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paas.fullname" . }}
  labels: {{- include "paas.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "paas.fullname" . }}
  labels: {{- include "paas.labels" . | nindent 4 }}
rules:
  # 自定义 CRD（core.aitoys.github.com）：reconcile Workload/DataService。
  - apiGroups: ["core.aitoys.github.com"]
    resources: ["workloads", "dataservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD status 子资源（Reconciler 回写 status.ready/phase）：update/patch 需单独授权。
  - apiGroups: ["core.aitoys.github.com"]
    resources: ["workloads/status", "dataservices/status"]
    verbs: ["update", "patch"]
  # 工作负载落地（WorkloadReconciler → Deployment/Job/CronJob；DataServiceReconciler → StatefulSet）。
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Service：workload service 类型建 K8s Service + StatefulSet headless（reconciler 全生命周期管理）。
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pods 只读：状态观测 / FillStatus 读 readyReplicas / builder 读 Job Pod 日志。
  # 不授 delete（Pod 删除由 Deployment/Job ownerRef 级联自动处理，core 不直接删 Pod，收敛攻击面）。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Ingress（workload spec.domain 非空时 reconciler 自动建 Ingress，host=Domain -> Service:Port）。
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Endpoints：数据面 /dp/instances 从 Endpoints 读 ready 实例（zeus 服务发现真源）。
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # DataService 凭证 Secret：reconciler 为 mysql/redis/nats/minio 创建凭证 Secret（DataServiceReconciler）。
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # DataService PVC：VolumeClaimTemplates 持久化 + resizePVC 扩容（实例浅管理）。
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Namespace：applier 写 CRD 前 EnsureNamespace 创建租户数据面 ns（paas-<tenant>，按租户隔离）。
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # DevOps 构建Job：core 取 Job Pod 日志解析 digest（builder.K8sJob，PAAS_DEVOPS_BUILDER=k8s）。
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "paas.fullname" . }}
  labels: {{- include "paas.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "paas.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "paas.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
