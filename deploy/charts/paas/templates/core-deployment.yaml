apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paas.fullname" . }}
  labels: {{- include "paas.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "paas.coreSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "paas.coreSelector" . | nindent 8 }}
    spec:
      containers:
        - name: core
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAAS_DB_URL
              {{- if .Values.db.enabled }}
              value: {{ printf "postgres://paas:paas-dev@%s-postgres:5432/paas?sslmode=disable" .Release.Name | quote }}
              {{- else }}
              value: {{ .Values.db.url | quote }}
              {{- end }}
            {{- if .Values.env.PAAS_API_KEY }}
            - name: PAAS_API_KEY
              value: {{ .Values.env.PAAS_API_KEY | quote }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
