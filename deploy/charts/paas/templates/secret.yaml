{{/* 敏感配置收敛：把凭证类 env 从 Deployment 明文迁移到 Secret + secretKeyRef 引用， */}}
{{/* 防 kubectl get deploy / describe pod 泄漏 JWT/数据库密码/第三方 Key 明文。   */}}
{{/* 值来源仍是 values（用户填法不变），chart 自动收敛；空值不入 Secret 减少噪音。 */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paas.fullname" . }}-secret
  labels: {{- include "paas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* DB 连接串（含密码），core PAAS_DB_URL 直接引用，避免明文进 Deployment env。 */}}
  {{- if .Values.db.enabled }}
  PAAS_DB_URL: {{ printf "postgres://paas:%s@%s-postgres:5432/paas?sslmode=disable" .Values.postgres.password .Release.Name | quote }}
  {{- else if .Values.db.url }}
  PAAS_DB_URL: {{ .Values.db.url | quote }}
  {{- end }}
  {{- /* 内置 postgres 密码（StatefulSet env 引用，密码不进 Deployment 明文）。 */}}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | default "paas-dev" | quote }}
  {{- /* JWT 签名 secret（生产必填）。 */}}
  {{- if .Values.auth.jwtSecret }}
  PAAS_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  {{- /* 敏感数据静态加密 master key（spec 2026-08-29，生产必填）。 */}}
  {{- if .Values.security.secretMasterKey }}
  PAAS_SECRET_MASTER_KEY: {{ .Values.security.secretMasterKey | quote }}
  {{- end }}
  {{- /* airouter 网关 API Key（推理入口）。 */}}
  {{- if .Values.maas.airouterApiKey }}
  PAAS_AIROUTER_API_KEY: {{ .Values.maas.airouterApiKey | quote }}
  {{- end }}
  {{- /* DevOps：私有 git token + registry 密码。 */}}
  {{- if .Values.devops.gitToken }}
  PAAS_GIT_TOKEN: {{ .Values.devops.gitToken | quote }}
  {{- end }}
  {{- if .Values.devops.registryPass }}
  PAAS_REGISTRY_PASS: {{ .Values.devops.registryPass | quote }}
  {{- end }}
  {{- /* 内置 Gitea 平台账号密码（与 deploy/devops/gitea.yaml Secret 一致）。 */}}
  {{- if .Values.devops.gitea.password }}
  PAAS_GITEA_PASSWORD: {{ .Values.devops.gitea.password | quote }}
  {{- end }}
  {{- /* 知识库后端凭证：qdrant API key + minio secret。 */}}
  {{- if .Values.kb.qdrantAPIKey }}
  PAAS_KB_QDRANT_API_KEY: {{ .Values.kb.qdrantAPIKey | quote }}
  {{- end }}
  {{- if .Values.kb.minioSecretKey }}
  PAAS_KB_MINIO_SECRET_KEY: {{ .Values.kb.minioSecretKey | quote }}
  {{- end }}
