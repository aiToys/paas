{{- if .Values.crds.install }}
# Workload / DataService CRD（controller-gen 生成，幂等 apply）。源：config/crds/。
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workloads.core.aitoys.github.com
spec:
  group: core.aitoys.github.com
  names:
    kind: Workload
    listKind: WorkloadList
    plural: workloads
    singular: workload
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workload 是平台工作负载的 K8s 期望状态声明。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkloadSpec 是工作负载期望状态（控制面下发，reconciler 据此落 K8s 资源）。
            properties:
              appId:
                type: string
              command:
                type: string
              envId:
                type: string
              gpu:
                description: GPURequest 是 GPU 资源请求（显存核算 + 反亲和）。
                properties:
                  count:
                    description: Count 是请求的 GPU 卡数（映射 nvidia.com/gpu resource）。
                    type: integer
                  memoryMB:
                    description: MemoryMB 是请求显存 MB（显存核算参考；本期以 Count 为准，细粒度留后续）。
                    type: integer
                type: object
              image:
                type: string
              imageRef:
                type: string
              laneId:
                type: string
              name:
                type: string
              replicas:
                format: int32
                type: integer
              schedule:
                type: string
              tenantId:
                type: string
              type:
                type: string
            required:
            - appId
            - envId
            - image
            - name
            - tenantId
            - type
            type: object
          status:
            description: WorkloadStatus 是 reconcile 后的实际状态（reconciler 回写）。
            properties:
              ready:
                format: int32
                type: integer
              status:
                type: string
            required:
            - ready
            - status
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: dataservices.core.aitoys.github.com
spec:
  group: core.aitoys.github.com
  names:
    kind: DataService
    listKind: DataServiceList
    plural: dataservices
    singular: dataservice
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DataService 是平台数据服务资源的 K8s 期望状态声明。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DataServiceSpec 是数据服务期望状态（控制面下发，reconciler 据此落 K8s StatefulSet）。
              Kind 取 dataservice 领域常量（db|cache|mq|storage|vector|search）；
              Engine 取 spec.engine（postgres|redis|kafka|...），reconciler 据 Kind+Engine 选容器镜像。
            properties:
              appId:
                type: string
              connection:
                additionalProperties:
                  type: string
                description: |-
                  Connection 平台生成的连接信息（host/port/credentials/uri），控制面下发，reconciler 读：
                    - 敏感 key（password/token/secretKey/database/accessKey）→ 建 Secret，Pod env 引用；
                    - host/port/uri → 可观测/调试（不进 Secret）。
                type: object
              engine:
                type: string
              envId:
                type: string
              kind:
                type: string
              name:
                type: string
              spec:
                additionalProperties:
                  type: string
                type: object
              tenantId:
                type: string
            required:
            - engine
            - envId
            - kind
            - name
            - tenantId
            type: object
          status:
            description: DataServiceStatus 是 reconcile 后的实际状态（reconciler 回写）。
            properties:
              image:
                type: string
              phase:
                type: string
              ready:
                format: int32
                type: integer
            required:
            - image
            - phase
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
