version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gosec
  exclusions:
    rules:
      # airsync 离线交付 CLI：文件读写/exec/解压均基于已 verify sha256 的可信 bundle，
      # gosec 的 G104（flag.ExitOnError 模式 errors unhandled）/G304（file inclusion）/G305（zip traversal）误报。
      - path: cmd/airsync|internal/airsync
        linters: [gosec]
        text: "G104|G204|G122|G304|G305"
      # devops 异步构建 goroutine 用 context.Background：构建生命周期独立于 HTTP 请求，
      # 请求 ctx 取消不应中断已提交的构建（G118 误报）。
      - path: internal/devops/(memory|pg)/store\.go
        linters: [gosec]
        text: "G118"
      # devops builder exec（git/docker）：参数经 os/exec 透传（不经 shell），业务逻辑 Go 侧算好防注入（G204 误报）。
      - path: internal/devops/builder/real\.go
        linters: [gosec]
        text: "G204"
      # manager 启动日志含 namespace（来自 env，非用户输入），G706 log injection 误报。
      - path: cmd/core/manager\.go
        linters: [gosec]
        text: "G706"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aitoys/paas
