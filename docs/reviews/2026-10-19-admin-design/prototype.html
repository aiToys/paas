<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaaS 管理后台优化 · 设计原型</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--surface2:#edf1f6;--hover:#e8eef7;--text:#19283d;--muted:#52627a;--border:#d9e1eb;--brand:#245fc6;--soft:#e8f0ff;--danger:#a92c31;--warn:#855300;--ok:#176944;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font)}button,input,select{font:inherit;color:inherit}button,a,select{cursor:pointer}button{border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:7px 12px;white-space:nowrap}button:hover{background:var(--hover)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}button.primary{background:var(--brand);border-color:var(--brand);color:white}button.link{border:0;background:transparent;color:var(--brand);padding:3px 5px}button.danger{color:var(--danger)}a{color:var(--brand);text-decoration:none}.skip{position:absolute;top:-100px;background:var(--surface);padding:12px;z-index:20}.skip:focus{top:0}
aside{position:fixed;inset:0 auto 0 0;width:228px;background:var(--surface);border-right:1px solid var(--border);overflow:auto;display:flex;flex-direction:column}.brand{height:83px;padding:20px 23px;display:flex;align-items:center;gap:10px;flex-shrink:0}.mark{display:grid;place-items:center;background:var(--brand);color:white;border-radius:7px;width:32px;height:32px;font-size:20px;font-weight:700}.brand strong{display:block;font-size:18px}.brand small{display:block;font-size:11px;color:var(--muted)}nav{padding:0 12px 20px;flex:1}.navhome,.group{display:block;border:0;width:100%;text-align:left;font-weight:600;background:none;padding:10px 12px;border-radius:5px}.group{margin-top:8px;color:var(--muted)}.group::after{content:'⌄';float:right}.group[aria-expanded=false]::after{content:'›'}.leaves{margin:2px 0 10px;padding-left:7px}.leaves[hidden]{display:none}.leaf{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 14px;font-size:13px}.active{background:var(--soft)!important;color:var(--brand)}.foot{padding:15px 23px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.shell{margin-left:228px}header{height:64px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:4}.bread{color:var(--muted);font-size:12px}.bread strong{color:var(--text);margin-left:10px}.tools{display:flex;gap:10px;align-items:center}.tools select{max-width:170px}.search{font-size:12px;color:var(--muted)}kbd{font:11px var(--font);border:1px solid var(--border);border-radius:3px;padding:1px 4px;margin-left:12px}.scope{padding:5px 9px;border-radius:5px;background:var(--soft);color:var(--brand);font-size:12px}main{padding:25px 30px 55px;max-width:1660px;margin:auto}.notice{padding:9px 13px;background:#fff8e6;border:1px solid #e4ca87;color:#694700;font-size:12px;border-radius:5px;margin-bottom:24px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin:0 0 24px}.heading h1{font-size:25px;line-height:1.35;letter-spacing:-.5px;margin:0 0 9px}.heading p{margin:0;color:var(--muted);font-size:13px}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:8px}.actions{display:flex;gap:8px;align-items:center}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:0 0 20px;overflow:hidden}.panelhead{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:10px}.panelhead h2{font-size:15px;margin:0}.panelhead small{color:var(--muted)}.pad{padding:20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;font-weight:650;margin:7px 0}.stat small{font-size:11px;color:var(--muted)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{background:#f8fafd;color:var(--muted);font-weight:500;text-align:left;font-size:12px}th,td{padding:13px 19px;border-bottom:1px solid #e8edf3;vertical-align:top}tr:last-child td{border-bottom:0}td small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.status{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:4px;font-size:12px;background:var(--surface2);color:var(--muted)}.status::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.red{color:var(--danger);background:#fce9ea}.amber{color:var(--warn);background:#fff3d8}.green{color:var(--ok);background:#e5f4eb}.blue{color:var(--brand);background:var(--soft)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin:0 0 20px;overflow:auto}.tab{border:0;background:none!important;border-radius:0;padding:10px 1px;color:var(--muted);border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:15px 19px;border-bottom:1px solid var(--border)}input,select{border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:7px 10px}input{min-width:210px}.subtle{font-size:12px;color:var(--muted)}.tile{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);gap:10px}.tile:last-child{border-bottom:0}.tile b{display:block;font-size:13px}.tile small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.listnote{padding:13px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.details small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.step{border:1px solid var(--border);border-radius:5px;padding:14px}.step small{display:block;color:var(--muted);margin-top:8px}.callout{padding:13px 18px;border-left:3px solid var(--brand);background:var(--soft);font-size:13px;margin-bottom:20px}.right{margin-left:auto}.mobile{display:none}dialog{border:1px solid var(--border);border-radius:10px;padding:0;max-width:700px;width:90vw;color:var(--text)}dialog::backdrop{background:#13213c70}.dialoghead{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.dialoghead h2{font-size:17px;margin:0}.dialogbody{padding:22px}.dialogbody p{color:var(--muted)}#searchbox input{width:100%;margin-bottom:12px}#results{max-height:55vh;overflow:auto}#results button{display:block;width:100%;text-align:left;margin:4px 0}#results small{display:block;color:var(--muted)}.empty{padding:45px 20px;text-align:center;color:var(--muted)}
@media(max-width:1100px){aside{width:208px}.shell{margin-left:208px}main{padding:22px}.grid{grid-template-columns:1fr}.search{display:none}header{padding:0 22px}.tools{gap:5px}.stats{gap:10px}.stat{padding:14px}.steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){aside{display:none;width:228px;z-index:9;box-shadow:0 0 0 100vw #13213c60}aside.open{display:flex}.shell{margin:0}.mobile{display:block}main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.heading{flex-direction:column}.bread{display:none}.tools{margin-left:auto}.scope{max-width:130px;overflow:hidden;white-space:nowrap}.details{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<a href="#content" class="skip">跳到主要内容</a>
<aside id="sidebar"><div class="brand"><span class="mark">P</span><span><strong>PaaS</strong><small>平台运营中枢</small></span></div><nav id="nav" aria-label="管理导航"></nav><div class="foot">设计原型 · 2026.10.19<br>23 个目标入口，按能力分期上线</div></aside>
<div class="shell"><header><button class="mobile" id="toggle" aria-label="展开导航">菜单</button><div class="bread">平台运营 / <strong id="crumb">平台总览</strong></div><div class="tools"><span class="scope" id="scopeLabel">浏览范围</span><select id="scope" aria-label="浏览租户"><option value="all">全部租户</option><option value="acme">Acme · t-acme</option><option value="globex">Globex · t-globex</option></select><button class="search" id="searchOpen">搜索功能 <kbd>⌘ K</kbd></button><span class="subtle">平台管理员</span></div></header><main id="content" tabindex="-1"></main></div>
<dialog id="detail"><div class="dialoghead"><h2 id="detailTitle"></h2><button data-close="detail" aria-label="关闭详情">关闭</button></div><div class="dialogbody" id="detailBody"></div></dialog>
<dialog id="searchbox"><div class="dialoghead"><h2>快速访问</h2><button data-close="searchbox">关闭</button></div><div class="dialogbody"><input id="query" placeholder="搜索引擎、角色、提示词、备份…" aria-label="搜索功能"><div id="results"></div></div></dialog>
<script>
// 离线设计原型：所有数字与对象均为示意，无 fetch、凭证、持久化或真实写操作。
const groups=[['租户与访问',[['tenants','租户管理','开通 组织'],['users','用户与授权','角色 权限'],['keys','API 密钥','入站 key']]],['AI 运营',[['models','模型与通道','推理 模型目录'],['vendors','供应商','上游'],['assets','AI 资产','智能体 工作流 知识库 提示词 工具 技能'],['runs','执行记录','AgentRun 工作流运行'],['market','资源广场','下架 内容治理']]],['应用与交付',[['products','产品','应用 application'],['workloads','工作负载','实例 日志 终端'],['delivery','交付记录','流水线 构建 镜像 发布'],['templates','流水线模板','版本 公共模板']]],['基础设施',[['data','数据服务','引擎 备份 恢复'],['env','环境与泳道','回收 访问'],['config','配置中心','命名空间 发布 差异'],['traffic','流量治理','路由 域名 熔断']]],['用量与账单',[['usage','用量与配额','tokens 限额 预算'],['bills','账单','结算']]],['安全与运维',[['secrets','凭证与证书','平台Secret 轮换'],['observability','可观测','告警 指标 日志 链路 采集'],['audit','审计日志','操作记录'],['diagnostics','平台诊断','漂移 registry K8s 版本']]]];
const flat=[['home','平台总览','关注事项',''],...groups.flatMap(([g,items])=>items.map(x=>[...x,g]))];
const platformPages=new Set(['models','vendors','templates','secrets','diagnostics']);
let page='home',tab='',scope='all';
const el=id=>document.getElementById(id);
const status=(text,c='')=>`<span class="status ${c}">${text}</span>`;
const action=(label,kind='info',extra='')=>`<button class="link" data-action="${kind}" ${extra}>${label}</button>`;
const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">没有符合当前浏览范围的示意记录</td></tr>`}</tbody></table></div>`;
const panel=(title,body,sub='')=>`<section class="panel"><div class="panelhead"><h2>${title}</h2><small>${sub}</small></div>${body}</section>`;
const tabs=(items,def)=>{if(!tab||!items.some(x=>x[0]===tab))tab=def||items[0][0];return`<div class="tabs" role="tablist">${items.map(([id,name])=>`<button class="tab" role="tab" aria-selected="${tab===id}" data-tab="${id}">${name}</button>`).join('')}</div>`};
const filters=(placeholder,extras='')=>`<div class="filters"><input placeholder="${placeholder}" aria-label="筛选列表" data-local-filter><select aria-label="状态筛选" data-status-filter><option>全部状态</option><option>失败</option><option>执行中</option></select>${extras}<button data-reset>重置</button></div>`;
const heading=(name,desc,button='')=>`<div class="heading"><div><div class="eyebrow">PLATFORM OPERATIONS</div><h1>${name}</h1><p>${desc}</p></div>${button}</div>`;
const metric=(name,value,note)=>`<div class="stat"><span>${name}</span><b>${value}</b><small>${note}</small></div>`;
const scopedRows=rows=>scope==='all'?rows:rows.filter(r=>r.join('').includes(scope==='acme'?'Acme':'Globex'));
function nav(){el('nav').innerHTML=`<button class="navhome ${page==='home'?'active':''}" data-page="home">平台总览</button>`+groups.map(([name,items],i)=>{const expanded=items.some(x=>x[0]===page);return`<button class="group" aria-expanded="${expanded}" aria-controls="group${i}" data-group="${i}">${name}</button><div class="leaves" id="group${i}" ${expanded?'':'hidden'}>${items.map(([id,label])=>`<button class="leaf ${page===id?'active':''}" ${page===id?'aria-current="page"':''} data-page="${id}">${label}</button>`).join('')}</div>`}).join('')}
function home(){return heading('平台总览','先处理需要关注的事项，再进入具体租户与资源。')+`<div class="callout">原型示例：3/4 数据源可用 · 采集后端暂不可达；数据缺失单独表达，不据此判断平台健康。</div>`+panel('需要关注',table(['事项','所属范围','观察状态','入口'],scopedRows([['结算工作流执行失败<small>flow-billing / run-example-01</small>','Acme · 测试',status('节点失败','red'),action('查看失败节点','run')],['配额接近上限<small>Token 用量达到本期配额 85%</small>','Acme',status('需关注','amber'),action('查看用量','usage')],['数据服务备份异常<small>db-orders · 真实快照任务</small>','Globex · 生产',status('产物生成失败','red'),action('查看备份任务','backup')]])),'均为设计示例，不代表实际告警')+`<div class="stats">${metric('租户','12','示意快照 · 不显示推算涨幅')}${metric('产品','48','application 统一展示为产品')}${metric('进行中流水线','6','运行状态，不等于故障')}${metric('待结算账单','3','账单记录，不代表收入')}</div><div class="grid">`+panel('最近平台操作',table(['操作','目标','执行证据'],[['扩容工作负载','Acme / api-server',status('执行中','blue')],['恢复到新实例','Globex / db-orders-restore',status('已受理')],['新增供应商凭证','平台 / vendor-primary',status('已保存','green')]]))+panel('常用操作',`<div class="pad"><div class="tile"><div><b>开通租户</b><small>用户、配额与环境按步骤完成</small></div><button data-page="tenants">进入</button></div><div class="tile"><div><b>配置模型供给</b><small>供应商 → 凭证 → 通道</small></div><button data-page="models">进入</button></div><div class="tile"><div><b>代建数据服务</b><small>指定目标租户和环境</small></div><button data-page="data">进入</button></div></div>`)+`</div>`}
function tenants(){return heading('租户管理','开通、核查资源与定位问题；产品和环境可由同一租户工作区进入。','<button class="primary" data-action="createTenant">开通租户</button>')+panel('租户',filters('按租户名称或 ID 搜索')+table(['租户','开通进度','资源与消耗','最近操作','操作'],scopedRows([['Acme<small>t-acme</small>',status('管理员已创建','green'),'8 个产品 · 17 个工作负载<small>示意：Token 配额使用 85%</small>','21:05 · 配额调整',action('运营详情','tenant')],['Globex<small>t-globex</small>',status('待分配环境','amber'),'3 个产品 · 5 个工作负载','20:42 · 创建用户',action('运营详情','tenant')]])))+panel('租户详情布局示意',`<div class="pad"><div class="details"><div><small>租户</small><b>Acme · t-acme</b></div><div><small>组织状态</small>当前模型无冻结状态，不伪造启停</div><div><small>浏览资源</small><button data-action="tenantScope">查看 Acme 资源</button></div></div></div>`+tabs([['overview','概览'],['members','用户与授权'],['resources','产品与资源'],['billing','用量与账单'],['audit','审计']])+`<div class="pad"><div class="steps"><div class="step">1. 创建租户<small>已完成 · 示例</small></div><div class="step">2. 创建管理员<small>已完成 · 示例</small></div><div class="step">3. 检查配额<small>查看可用额度</small></div><div class="step">4. 按需分配资源<small>环境 / 数据服务</small></div></div></div>`)}
function models(){return heading('模型与通道','配置状态、最近诊断与真实请求结果分别展示。','<button class="primary" data-action="createModel">新建模型</button>')+`<div class="callout">平台级目录，不按租户过滤。通道保存成功仅表示已配置，不能证明真实推理可用。</div>`+panel('模型供给',filters('搜索模型或能力')+table(['模型','能力 / 价格单位','通道配置','最近诊断','操作'],[['模型 A<small>model-a · 示例</small>','文本 / 推理<small>价格按每百万 Token</small>',status('2 个已配置','blue'),status('尚未诊断'),action('通道详情','channel')],['模型 B<small>model-b · 示例</small>','向量',status('缺少凭证','amber'),'未请求上游',action('补充配置','credential')]]))+panel('模型 A · 通道详情示意',tabs([['channels','通道'],['info','模型信息'],['changes','变更记录']])+table(['通道 / 供应商','优先级','凭证引用','配置状态','实际证据'],[['主通道<small>供应商 A</small>','10','platform-secret-01',status('已配置','blue'),'未诊断<small>不能显示“推理正常”</small>'],['备通道<small>供应商 B</small>','20',action('创建平台凭证','credential'),status('缺少凭证','amber'),'未请求上游']]))}
function data(){let t=tabs([['instances','实例'],['engines','引擎目录'],['backups','备份恢复']]);let body=tab==='backups'?`<div class="callout">备份产物完成 ≠ 恢复验证通过。record 仅记录意图，无备份产物与恢复入口。</div>`+panel('备份与恢复任务',filters('搜索数据服务或任务 ID')+table(['任务 / 模式','资源与归属','执行结果','产物 / 恢复证明','操作'],scopedRows([['backup-example-01<small>snapshot · Postgres</small>','Acme / db-orders / 测试',status('产物已完成','green'),'128 MiB · 校验和已记录<small>尚无恢复演练证明</small>',action('恢复到新实例','restore')],['backup-example-02<small>record · 记录模式</small>','Globex / db-cache / 测试',status('记录已保存'),'无产物 · 不可恢复',action('查看记录','backup')]]))):tab==='engines'?`<div class="callout">引擎为平台供给目录，不按租户过滤；从引擎可直接查看使用中的实例。</div>`+panel('引擎目录',table(['引擎','类型','交付模式','状态','影响面'],[['Postgres 16','数据库','平台托管',status('已启用','green'),action('查看使用实例','instances')],['Redis','缓存','专属外部实例',status('未启用'),action('查看配置','info')]])):panel('数据服务实例',filters('搜索名称、引擎或实例 ID')+table(['实例','租户 / 环境','引擎','实际状态','操作'],scopedRows([['db-orders<small>ds-orders</small>','Acme · 测试','Postgres 16',status('已就绪','green'),action('详情与运维','instance')],['db-analytics<small>ds-analytics</small>','Globex · 生产','Postgres 16',status('执行中','blue'),action('查看进度','instance')]])));return heading('数据服务','实例、引擎与备份同处一页，供给与运行关系清楚可追踪。','<button class="primary" data-action="createData">代建数据服务</button>')+t+body}
function runs(){return heading('执行记录','区分执行系统及归因来源；平台未知归属不混进单租户统计。')+tabs([['agentrun','外部 AgentRun'],['workflow','工作流运行']])+`<div class="callout">${tab==='agentrun'?'上游无租户维度：这是平台执行域，不使用当前租户过滤，也不按名称前缀推断租户。':'工作流使用独立管理接口；等待业务确认与失败状态分别表达，不默认代用户批准。'}</div>`+panel(tab==='agentrun'?'平台执行域':'工作流运行',table(['运行','来源 / 归属','状态','Token / 结果','操作'],tab==='agentrun'?[['auto-review-example','自动审查 · 平台执行域',status('执行失败','red'),'上游统计 18k<small>不等于平台账单金额</small>',action('查看运行','run')]]:scopedRows([['flow-billing / run-01','Acme · 工作流',status('节点失败','red'),'失败节点：model_call',action('查看失败节点','run')],['flow-support / run-02','Globex · 工作流',status('等待确认','amber'),'停在人工确认节点',action('查看等待节点','run')]])))}
function observability(){return heading('可观测','从告警进入实体、日志与链路，采集失败单独处理。')+tabs([['alerts','当前告警'],['events','历史事件'],['metrics','指标'],['logs','日志'],['traces','链路'],['rules','规则'],['quality','采集诊断']])+panel(tab==='quality'?'采集质量':tab==='rules'?'告警规则':'排障视图 · '+tab,table(['对象 / 数据源','范围','状态','证据','操作'],scopedRows([['db-orders / metrics','Acme · 测试',status('采集失败','red'),'数据源连接超时',action('查看采集诊断','quality')],['api-server / Pod','Globex · 生产',status('告警触发','amber'),'重启次数达到阈值',action('进入实例日志','instance')]])),'设计目标，需要补充跨租户管理 API')+`<div class="callout">无数据、没有告警、未接入、读取失败是四种不同结果。打开 trace 必须保留租户、实体与时间范围。</div>`}
function diagnostics(){return heading('平台诊断','只读检查与修复命令分开；livez 成功不能证明整个运行链健康。')+panel('组件与交付状态',table(['检查项','范围','状态','观察依据','下一步'],[['运行版本','Core / 嵌入前端',status('待核对','amber'),'示意：构建版本与工作树可不同',action('查看制品信息','info')],['数据库 / 迁移','平台',status('尚未接入诊断'),'不回显连接密码',action('查看接入边界','info')],['K8s / RBAC','数据面',status('未提供检查结果'),'不能据此判断控制器正常',action('查看检查项','info')],['工作负载漂移','跨租户',status('需检查','amber'),'已有 reconcile 为真实写操作',action('查看修复边界','reconcile')],['可观测后端','平台',status('采集失败','red'),'独立报告错误和最后成功时间',action('采集诊断','quality')]]))+`<div class="callout">私有化、离线交付和 SaaS 共用语义。没有 dry-run 接口前不展示“预览修复成功”；不提供任意平台配置编辑或集群升级按钮。</div>`}
const configs={users:['用户','内置角色与权限'],keys:['API 密钥','已吊销'],vendors:['供应商配置','关联通道'],assets:['智能体','工作流','知识库','工具','提示词','技能'],market:['已发布内容','平台下架记录'],products:['产品','资源关联'],workloads:['工作负载','操作记录'],delivery:['流水线运行','构建','镜像','发布'],templates:['模板','使用方与版本'],env:['环境','泳道'],config:['命名空间','发布与引用'],traffic:['注册服务','路由','熔断'],usage:['用量分析','资源配额'],bills:['账单记录'],secrets:['平台凭证','租户凭证'],audit:['审计记录']};
function other(){const name=flat.find(x=>x[0]===page)?.[1]||'';return heading(name,'页面布局示意：保持统一筛选、归属、状态与关联详情。')+(platformPages.has(page)?'<div class="callout">平台级供给，不随浏览租户过滤。敏感配置只显示掩码与引用关系。</div>':'')+tabs((configs[page]||['总览']).map((x,i)=>[String(i),x]))+panel('管理视图结构',filters('按名称或 ID 筛选')+table(['名称 / ID','归属','状态与结果','操作'],scopedRows([['示例对象 A<small>example-a · 布局占位</small>',platformPages.has(page)?'平台':'Acme · 测试',status('待观察'),'详情 / 关联资源 / 操作记录'],['示例对象 B<small>example-b · 布局占位</small>',platformPages.has(page)?'平台':'Globex · 生产',status('缺少数据源','amber'),'查看说明']])),'该页为结构示意，完整业务规则以设计文档为准')+`<div class="callout">${page==='users'?'内置角色保持只读；不因新增授权页面而产生自定义角色或扩大权限。':page==='assets'?'优先补跨租户只读详情和引用，工作流编辑器继续留在用户端。':page==='bills'?'人工标记结算需凭据与审计；不伪装成真实支付或收入。':page==='secrets'?'先补平台凭证创建和引用链，轮换需新生命周期契约；API 密钥在租户与访问中管理。':'新增管理能力必须先有真实 API、权限与执行证据，不以设计原型代表已实现。'}</div>`}
function render(){nav();el('crumb').textContent=flat.find(x=>x[0]===page)?.[1]||'';el('scopeLabel').textContent=platformPages.has(page)?'平台级目录':page==='runs'&&tab!=='workflow'?'平台执行域':'浏览范围';const views={home,tenants,models,data,runs,observability,diagnostics};el('content').innerHTML='<div class="notice">交互设计原型 · 全部数字、状态和对象为示意；不会请求业务 API 或执行管理操作。可展开左侧分组、切换页面与 tab，或使用 ⌘K 搜索。</div>'+(views[page]||other)();el('scopeLabel').textContent=platformPages.has(page)?'平台级目录':page==='runs'&&tab==='agentrun'?'平台执行域':'浏览范围';}
function go(id,t=''){page=id;tab=t;el('sidebar').classList.remove('open');render();el('content').focus();window.scrollTo(0,0)}
function show(kind){const content={tenant:['租户运营详情','概览 → 用户与授权 → 产品与资源 → 用量与账单 → 审计。当前仅为设计示意。'],channel:['通道运维详情','展示供应商、凭证引用、优先级、配置状态与最近真实请求/探测时间。保存成功不能证明上游可用。'],credential:['创建平台凭证','从供应商表单就地补建，成功后回填引用并保留原草稿；不回显明文，不将 Secret 放入 API 密钥。'],instance:['实例与运维结果','固定租户与实际环境，分运行概览、实例/日志、备份恢复、操作记录；受理和已生效分开。'],backup:['备份任务详情','记录模式、引擎、产物、校验时间、失败原因与恢复任务；无产物不显示恢复按钮。'],restore:['恢复到新实例','确认源快照、目标租户与环境、引擎支持、配额和产物访问；不覆盖原实例。原型不执行恢复。'],run:['运行详情','精确来源和运行 ID，默认定位失败/等待节点；输入输出脱敏，业务审批与平台中止分权。'],reconcile:['漂移修复边界','现有 reconcile 是写操作；待 dry-run 管理契约实现后再展示影响预览。此原型不会触发修复。'],createTenant:['开通租户','创建组织 → 创建管理员 → 检查配额 → 按需分配环境/数据服务；每步可独立重试。'],createData:['代建数据服务','必须选择目标租户、真实环境、引擎和规格，展示配额影响；归属由管理端服务校验。'],createModel:['配置模型供给','复用模型、供应商、通道 CRUD；新模型不因配置保存成功就被称为可用。'],info:['设计边界','页面结构为示意。请以设计文档中的能力矩阵、权限边界和分期验收为准。']};const [title,body]=content[kind]||content.info;el('detailTitle').textContent=title;el('detailBody').innerHTML=`<div class="details"><div><small>能力状态</small>待按设计实施</div><div><small>数据来源</small>设计示例</div><div><small>操作范围</small>不会执行真实操作</div></div><p>${body}</p><div class="callout">实际实现必须明确资源归属、授权、影响、审计与最终结果。</div>`;el('detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.group){const id=b.dataset.group;const on=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!on));el('group'+id).hidden=on;return}if(b.dataset.close){el(b.dataset.close).close();return}if(b.hasAttribute('data-reset')){const box=b.closest('.panel');box.querySelector('[data-local-filter]').value='';box.querySelector('[data-status-filter]').selectedIndex=0;filterRows(box);return}const k=b.dataset.action;if(k){if(k==='usage')go('usage');else if(k==='tenantScope'){scope='acme';el('scope').value='acme';go('products')}else if(k==='instances')go('data','instances');else if(k==='quality')go('observability','quality');else show(k)}});
function filterRows(box){const term=(box.querySelector('[data-local-filter]')?.value||'').trim().toLowerCase();const state=box.querySelector('[data-status-filter]')?.value||'全部状态';box.querySelectorAll('tbody tr').forEach(r=>{const txt=r.textContent.toLowerCase();r.hidden=!(txt.includes(term)&&(state==='全部状态'||txt.includes(state)))})}
document.addEventListener('input',e=>{if(e.target.matches('[data-local-filter]'))filterRows(e.target.closest('.panel'))});document.addEventListener('change',e=>{if(e.target.matches('[data-status-filter]'))filterRows(e.target.closest('.panel'))});
el('scope').addEventListener('change',e=>{scope=e.target.value;render()});el('toggle').onclick=()=>el('sidebar').classList.toggle('open');
function search(){const q=el('query').value.trim().toLowerCase();const results=flat.filter(x=>(x[1]+' '+x[2]+' '+x[3]).toLowerCase().includes(q));el('results').innerHTML='';for(const x of results){const b=document.createElement('button');b.textContent=x[1]+' · '+(x[3]||'平台');b.onclick=()=>{el('searchbox').close();const target=q.includes('备份')?'backups':q.includes('引擎')?'engines':q.includes('角色')?'1':q.includes('提示词')?'4':'';go(x[0],target)};el('results').append(b)}}
function openSearch(){el('query').value='';search();el('searchbox').showModal();el('query').focus()}el('searchOpen').onclick=openSearch;el('query').oninput=search;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')el('sidebar').classList.remove('open')});render();
</script>
